# ------------------------------------------------------------------
#  TEKSTERNE PÅ TONIWORKS.DK
# ------------------------------------------------------------------
#
#  Ret teksterne her. Lad feltnavnene stå (det, der står før kolon,
#  fx "email:"). Linjer, der starter med #, er forklaringer. De vises
#  ikke på siden.
#
#  Lange tekster står på linjerne under ">-", rykket ind med mellemrum.
#  I må bryde linjerne, hvor I vil: på siden bliver det ét afsnit.
#  Kolon, anførselstegn og alle andre tegn er fine der.
#
#  Når I gemmer (Commit changes), bygges siden igen og er online efter
#  et par minutter. Er der en fejl i filen, viser GitHub et rødt kryds
#  med en forklaring, og den nuværende version af siden bliver ved med
#  at være online, til fejlen er rettet.
# ------------------------------------------------------------------

about:
  # Den store første tekst på about-siden.
  indledning: >-
    TONI Works er et produktionsselskab i København.

  # Afsnittene under indledningen. Hvert afsnit starter med "- >-".
  # Nyt afsnit: kopiér et helt afsnit (fra "- >-" til og med sidste
  # linje tekst), sæt det ind under, og ret teksten.
  afsnit:
    - >-
      Reklamefilm, musikvideo, kortfilm, TikTok. Kan det optages, kan vi
      producere det. Vi er dit produktionsselskab.

  # Den sidste, grå linje. Fjern den ved at rette linjen til
  #   sidste_linje: ''
  # (slet >- og teksten under).
  sidste_linje: ''

kontakt:
  # Mailadressen nederst på hver side.
  email: hello@toniworks.dk
  # Den grå linje under mailadressen.
  tekst: >-
    Skriv til os. Vi svarer, når kameraet er pakket ned.
  # Navnet på Instagram, uden @. Linket laves automatisk.
  instagram: toni___works
  # Byen nederst på siden. Står også i sidens beskrivelse til Google.
  by: København

film:
  # Navne i linjen under hver film: "Produceret for SALTY af ...".
  # Står der '', slutter linjen efter kundens navn.
  produceret_af: ''

# Firmaoplysninger (e-handelsloven § 7). De vises nederst under ©,
# når de er udfyldt. Lad dem stå som '' indtil da.
firma:
  navn: ''      # fx TONI Works ApS
  adresse: ''   # fx Gadenavn 1, 2200 København N
  cvr: ''       # 8 cifre, fx 12345678
